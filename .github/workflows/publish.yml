# [INPUT]: 依赖 Git tag、GitHub CLI、Bun/Node/npm 与 npm OIDC
# [OUTPUT]: 校验、构建 rn-update-cli，自动生成 GitHub Release 并发布到 npm
# [POS]: 独立公开 CLI 仓库的发布闸门；手动推送 tag 是唯一版本入口
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md

name: Publish Package to npmjs
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing tag to publish, for example v1.1.1'
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

concurrency:
  group: npm-publish-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest  # npm --provenance requires a GitHub-hosted runner
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_tag || github.ref_name }}

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Prepare publish version
        env:
          PUBLISH_VERSION: ${{ env.RELEASE_TAG }}
        run: bun scripts/prepublish.ts

      - name: Verify package version matches release tag
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          ACTUAL_VERSION="$(node -p "require('./package.json').version")"
          echo "release tag: ${RELEASE_TAG} -> expected ${EXPECTED_VERSION}, package.json has ${ACTUAL_VERSION}"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"

      - name: Build package
        run: bun run build

      # Node 18 must only be on PATH for the verification below, not during
      # the build: typescript >= 7 ships an extensionless ESM bin/tsc that
      # Node 18.17 cannot load (ERR_UNKNOWN_FILE_EXTENSION).
      - name: Set up Node.js 18 for runtime verification
        uses: actions/setup-node@v7
        with:
          node-version: '18.17.0'

      - name: Verify built CLI with Node.js 18
        run: |
          node --version
          node lib/bin.js -v
          # the programmatic entry points must also load on the minimum
          # supported Node, not only the CLI banner
          node -e "const m = require('./lib/exports.js'); if (!m) process.exit(1)"
          node -e "const d = require('./lib/diff.js'); if (!d.diffCommands) process.exit(1)"

      - name: Set up Node.js for npm publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Verify publishable package contents
        run: npm pack --dry-run --ignore-scripts

      - name: Create GitHub Release from tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; reusing it"
            exit 0
          fi

          RELEASE_ARGS=(--verify-tag --generate-notes)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            "${RELEASE_ARGS[@]}"

      - name: Publish to npm
        shell: bash
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish --ignore-scripts --provenance --access public --tag beta
          else
            npm publish --ignore-scripts --provenance --access public
          fi
